<style>

dl{margin:0;padding:8px 12px 10px;font-size:13.5px}

dd{margin:0}

.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 2px}

.sheet textarea{min-height:60px}
.row{display:flex;gap:8px}.row>div{flex:1}
.stars button{border:0;background:none;font-size:26px;color:var(--line);padding:0 2px}

.acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
#ex{width:100%;height:90px;margin-bottom:10px}
@media print{.noprint{display:none!important}body{background:#fff}}

:root:root:root{--bg:#f8f7fb;--fg:#24203a;--card:#fff;--line:#e4e1ee;--mut:#6f6a86;--acc:#4f2f8f;--accfg:#fff;--on:#4f2f8f;color-scheme:light}
[data-lv="神単"]{--c:#e2b64a;--b:#f8edc9;--t:#8a6a10}[data-lv="楽単"]{--c:#6cc3a0;--b:#d9f1e6;--t:#2b7656}[data-lv="準楽単"]{--c:#6b8fe8;--b:#dde6fb;--t:#3453b0}[data-lv="厳単"]{--c:#ee9aa6;--b:#fbdde1;--t:#a93a49}
.wrap{padding-bottom:96px}
.hd{text-align:center;border-bottom:2px solid var(--acc);padding:6px 0 10px;margin-bottom:12px}

.hd .sub{margin:2px 0 0}
.info{background:#ece8f6;color:var(--acc);border-radius:6px;padding:10px 12px;font-size:12.5px;margin-bottom:10px}

th{background:#f1eff6}td{height:64px;background:var(--card)}

details{border-left:5px solid var(--acc);border-radius:6px;box-shadow:0 1px 4px rgba(60,40,110,.07)}

.bd{font-style:normal;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--b);color:var(--t)}
.fv{border:0;background:none;font-size:22px;color:var(--mut);padding:0 2px}.fv.on{color:var(--acc)}.fv.on::before{content:"♥";position:absolute;margin-left:0}.fv.on{font-size:0}.fv.on::before{font-size:22px}
dt{font-size:13px;border-left:3px solid var(--acc);padding-left:6px;margin-top:10px}

.wrap{padding-bottom:40px}
.hd{text-align:left;padding:4px 0 8px}

</style></head>
<body><div class="wrap">
<div class="hd"><h1>履修相談マニュアル電子版</h1></div>
<div class="info noprint">ⓘ　誰でも閲覧できます。編集は管理者パスワードを入力した作成者のみ可能です。</div>

  <span id="ad" class="hid" style="display:contents"></span>
</div>
<textarea id="ex" class="hid" readonly></textarea>

<div id="home">
<div class="tabs noprint" id="tabs">

</div>

</div>

</div>

<div id="tm" class="hid"><div class="sheet">

</div></div>

const PW='0655'; /* 管理者パスワード（ここを書き換える） */
const KEY='rishu_v5',DAYS=['月','火','水','木','金','土'],PER=5,LV=['神単','楽単','準楽単','厳単'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function init(){let st=null;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}const D=st&&st.v>=DATA.v&&st.c&&st.t?st:DATA;courses=D.c.map(x=>({...x}));T=D.t.map(x=>({...x}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:Date.now(),c:courses,t:T}))}catch(e){}}
let courses=[],T=[],admin=false,cur=null,isNew=false,tab='tt',sub='憲法';

/* 二度押しで実行 */
function sure(b,fn){if(b.dataset.s){delete b.dataset.s;b.textContent=b.dataset.t;fn();return}b.dataset.t=b.textContent;b.dataset.s=1;b.textContent='本当に？';setTimeout(()=>{if(b.dataset.s){delete b.dataset.s;b.textContent=b.dataset.t}},2500)}

function grid(){
  let h='<table><thead><tr><th></th>'+DAYS.map(d=>`<th>${d}</th>`).join('')+'</tr></thead><tbody>';
  for(let p=1;p<=PER;p++){h+=`<tr><th>${p}</th>`;
    for(let d=0;d<6;d++)h+=`<td data-d="${d}" data-p="${p}">`+courses.filter(c=>c.d===d&&c.p===p).map(c=>`<div class="card" data-id="${c.id}" data-lv="${c.lv}"><b>${esc(c.n)}</b><small>${c.lv}</small></div>`).join('')+'</td>';
    h+='</tr>'}
  $('#grid').innerHTML=h+'</tbody></table>';
}

/* 長押しドラッグでコマ移動（管理者のみ） */
let drag=null,timer=null,sx=0,sy=0,sup=false;
const G=$('#grid');
G.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.card');if(!el||!admin)return;
  sx=e.clientX;sy=e.clientY;
  timer=setTimeout(()=>{
    const g=el.cloneNode(true);g.style.cssText=`position:fixed;pointer-events:none;width:${el.offsetWidth}px;opacity:.85;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3)`;
    document.body.append(g);el.style.opacity=.3;drag={id:+el.dataset.id,g,el};sup=true;mv(e);
  },450);
});
function mv(e){if(!drag)return;drag.g.style.left=(e.clientX-drag.g.offsetWidth/2)+'px';drag.g.style.top=(e.clientY-20)+'px';
  document.querySelectorAll('td.over').forEach(t=>t.classList.remove('over'));
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('td[data-d]');if(t)t.classList.add('over')}
document.addEventListener('pointermove',e=>{
  if(timer&&!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){clearTimeout(timer);timer=null}
  mv(e)});
document.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});
function end(e){
  clearTimeout(timer);timer=null;
  if(drag){
    const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('td[data-d]');
    if(t&&e.type==='pointerup'){const c=courses.find(x=>x.id===drag.id);c.d=+t.dataset.d;c.p=+t.dataset.p;save()}
    drag.g.remove();drag=null;document.querySelectorAll('td.over').forEach(x=>x.classList.remove('over'));grid();
    setTimeout(()=>sup=false,50);
  }
}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
G.addEventListener('click',e=>{
  if(sup)return;const el=e.target.closest('.card');if(!el)return;
  openM({...courses.find(c=>c.id===+el.dataset.id)},false);
});
G.addEventListener('contextmenu',e=>{if(admin)e.preventDefault()});

/* 評価シート */
function stars(el,key){el.innerHTML='';for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent='★';b.setAttribute('aria-label',i+'点');if(cur[key]>=i)b.className='on';
  if(admin)b.onclick=()=>{cur[key]=cur[key]===i?0:i;stars(el,key)};else b.disabled=true;el.append(b)}}
function openM(c,n){
  cur=c;isNew=n;
  $('#f-d').innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('');
  $('#f-p').innerHTML=Array.from({length:PER},(_,i)=>`<option value="${i+1}">${i+1}限</option>`).join('');
  $('#f-lv').innerHTML=LV.map(l=>`<option>${l}</option>`).join('');
  $('#f-n').value=c.n;$('#f-d').value=c.d;$('#f-p').value=c.p;$('#f-lv').value=c.lv;
  $('#f-g').value=c.good;$('#f-b').value=c.bad;$('#f-a').value=c.att;$('#f-m').value=c.memo;
  document.querySelectorAll('#md input,#md select,#md textarea').forEach(x=>x.disabled=!admin);
  stars($('#s-e'),'ease');stars($('#s-f'),'fun');
  $('#sv').classList.toggle('hid',!admin);$('#del').classList.toggle('hid',!admin||n);
  $('#md').classList.remove('hid');
}
$('#cl').onclick=()=>$('#md').classList.add('hid');
$('#md').addEventListener('click',e=>{if(e.target.id==='md')$('#md').classList.add('hid')});
$('#sv').onclick=()=>{
  const n=$('#f-n').value.trim();if(!n){$('#f-n').focus();return}
  Object.assign(cur,{n,d:+$('#f-d').value,p:+$('#f-p').value,lv:$('#f-lv').value,good:$('#f-g').value,bad:$('#f-b').value,att:$('#f-a').value,memo:$('#f-m').value});
  if(isNew)courses.push(cur);else courses[courses.findIndex(c=>c.id===cur.id)]=cur;
  save();grid();$('#md').classList.add('hid');
};
$('#del').onclick=function(){sure(this,()=>{courses=courses.filter(c=>c.id!==cur.id);save();grid();$('#md').classList.add('hid')})};

/* 先生別マニュアル（三法・法日） */
function man(){
  const subj=tab==='san'?sub:'法日';
  let h=tab==='san'?'<div class="pills">'+['憲法','民法','刑法'].map(s=>`<button data-s="${s}" class="${s===sub?'on':''}">${s}</button>`).join('')+'</div>':'';
  h+=MAN.filter(m=>m[0]===subj).map(m=>`<details><summary><b>${m[1]}先生</b><span>${esc(m[2]||'総評の記載なし')}</span></summary><dl><dt>評価・テスト</dt><dd>${esc(m[3])}</dd>${m[4]?`<dt>対策</dt><dd>${esc(m[4])}</dd>`:''}</dl></details>`).join('');
  $('#man').innerHTML=h;
}
$('#man').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){sub=b.dataset.s;man()}});
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]');if(!b)return;tab=b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#tt').classList.toggle('hid',tab!=='tt');$('#man').classList.toggle('hid',tab==='tt');
  if(tab!=='tt')man();
});

/* 管理者モード */
$('#go').onclick=()=>{
  if($('#pw').value!==PW){$('#pw').value='';$('#pw').placeholder='パスワードが違います';return}

};
init();grid();
const CAT={san:'三法',nichi:'法日',lang:'言語'};
const ln=n=>esc(n)+(/先生$/.test(n)?'':'先生');
function tc(m){return `<details><summary><div><b>${ln(m.name)}</b><span>${m.subj?esc(m.subj)+'　':''}${esc(m.sum||'総評の記載なし')}</span></div><div class="rt">${m.lv?`<i class="bd" data-lv="${m.lv}">${m.lv}</i>`:''}${admin?`<button class="btn ed" data-id="${m.id}">編集</button>`:''}</div></summary><dl>${m.rev?`<dt>評価・テスト</dt><dd>${esc(m.rev)}</dd>`:''}${m.tip?`<dt>対策</dt><dd>${esc(m.tip)}</dd>`:''}</dl></details>`}
function man(){
  if(tab==='tt')return;
  const L=T.filter(m=>m.cat===tab),ss=[...new Set(L.map(m=>m.subj))];
  if(!ss.includes(sub))sub=ss[0]||'';
  const pills=ss.length>1?'<div class="pills">'+ss.map(x=>`<button data-s="${esc(x)}" class="${x===sub?'on':''}">${esc(x)}</button>`).join('')+'</div>':'';
  const v=ss.length>1?L.filter(m=>m.subj===sub):L;
  $('#man').innerHTML=pills+(v.map(tc).join('')||`<p class="note">まだ先生が登録されていません。${admin?'上の追加ボタンから登録できます。':''}</p>`);
}
let tm=null,tNew=false;
function openT(m){
  tNew=!m;tm=m?{...m}:{id:Date.now(),cat:tab,subj:tab==='nichi'?'法日':sub,name:'',lv:'',sum:'',rev:'',tip:''};
  $('#t-c').value=tm.cat;$('#t-s').value=tm.subj;$('#t-n').value=tm.name;$('#t-l').value=tm.lv;$('#t-m').value=tm.sum;$('#t-r').value=tm.rev;$('#t-t').value=tm.tip;
  $('#t-sl').innerHTML=[...new Set(T.map(x=>x.subj))].map(x=>`<option value="${esc(x)}">`).join('');
  $('#t-del').classList.toggle('hid',tNew);$('#tm').classList.remove('hid');
}
document.addEventListener('click',e=>{const b=e.target.closest('.ed');if(!b)return;e.preventDefault();openT(T.find(x=>x.id===+b.dataset.id))});
$('#t-cl').onclick=()=>$('#tm').classList.add('hid');
$('#tm').addEventListener('click',e=>{if(e.target.id==='tm')$('#tm').classList.add('hid')});
$('#t-sv').onclick=()=>{
  const n=$('#t-n').value.trim();if(!n){$('#t-n').focus();return}
  Object.assign(tm,{cat:$('#t-c').value,subj:$('#t-s').value.trim(),name:n,lv:$('#t-l').value,sum:$('#t-m').value,rev:$('#t-r').value,tip:$('#t-t').value});
  if(tNew)T.push(tm);else T[T.findIndex(x=>x.id===tm.id)]=tm;
  if(tm.cat===tab)sub=tm.subj;
  save();$('#tm').classList.add('hid');man();
};
$('#t-del').onclick=function(){sure(this,()=>{T=T.filter(x=>x.id!==tm.id);save();$('#tm').classList.add('hid');man()})};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hid');setTimeout(()=>e.classList.add('hid'),5000)}
async function exportHTML(){
  const d=JSON.stringify({v:Date.now(),c:courses,t:T}).replace(/</g,'\\u003c');
  try{
    const r=await fetch(location.href.split('#')[0]);if(!r.ok)throw 0;let h=await r.text();
    h=h.replace(new RegExp('/\\*DA'+'TA\\*/[\\s\\S]*?/\\*EN'+'D\\*/'),()=>'/*DA'+'TA*/const DATA='+d+';/*EN'+'D*/');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';a.click();
    toast('index.html を書き出しました。GitHubに上書きアップロードすると、みんなの画面に反映されます。');
  }catch(e){const t=$('#ex');t.value=d;t.classList.remove('hid');t.select();toast('自動で書き出せなかったため、データを下に表示しました。')}
}
